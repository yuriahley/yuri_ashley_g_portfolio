<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopify Product Listing | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050814;
            color: white;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        .container {
            width: min(100% - 40px, 1100px);
            margin: auto;
        }

        .back {
            display: inline-block;
            margin: 30px 0;
            color: #a78bfa;
            text-decoration: none;
        }

        .header {
            padding: 60px 0 40px;
        }

        .category {
            color: #a78bfa;
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        h1 {
            font-size: clamp(40px, 6vw, 65px);
            line-height: 1.1;
            margin: 15px 0;
        }

        .intro {
            max-width: 700px;
            color: #9ca5bd;
            font-size: 16px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 50px 0;
        }

        .detail {
            background: #0d1326;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 10px;
            padding: 25px;
        }

        .detail small {
            color: #737c94;
        }

        .detail h3 {
            margin-top: 8px;
        }

        .work-title {
            margin: 70px 0 25px;
            font-size: 30px;
        }

        .screenshots {
            display: grid;
            gap: 25px;
        }

        .screenshots img {
            width: 100%;
            display: block;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.1);
        }

        .back-bottom {
            display: inline-block;
            margin: 50px 0;
            padding: 12px 20px;
            background: #7c4dff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        @media (max-width: 700px) {
            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="index.html" class="back">
        ← Back to Portfolio
    </a>

    <div class="header">

        <div class="category">
            E-COMMERCE
        </div>

        <h1>
            Shopify Product Optimization
        </h1>

        

    </div>


    <div class="details">

        <div class="detail">
            <small>SERVICE</small>
            <h3>Product Optimization</h3>
        </div>

        <div class="detail">
            <small>TOOLS</small>
            <h3>Shopify + Canva</h3>
        </div>

        <div class="detail">
            <small>ROLE</small>
            <h3>E-commerce VA</h3>
        </div>

    </div>


    <h2 class="work-title">
        My Work
    </h2>


    <div class="screenshots">

        <img src="shopifystored.jpeg"
             alt="Shopify product listing screenshot">

        <img src="shopifyproductds.jpg"
             alt="Shopify product listing screenshot">

        <img src="shopifycollectiodns.jpg"
             alt="Shopify product listing screenshot">

    </div>


    <a href="index.html" class="back-bottom">
        ← Back to Projects
    </a>

</div>

</body>
</html>
