<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopify Product Research | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050814;
            color: white;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        .container {
            width: min(100% - 40px, 1050px);
            margin: auto;
        }

        /* Back Link */
        .back {
            display: inline-block;
            margin-top: 28px;
            color: #a78bfa;
            text-decoration: none;
            font-size: 14px;
            transition: opacity .2s;
        }

        .back:hover {
            opacity: .7;
        }

        /* Header */
        .header {
            padding: 75px 0 45px;
            max-width: 850px;
        }

        .category {
            color: #a78bfa;
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        h1 {
            font-size: clamp(42px, 6vw, 68px);
            line-height: 1.05;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }

        .intro {
            color: #9ca5bd;
            font-size: 16px;
            max-width: 650px;
        }

        /* Project Details */
        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 15px 0 70px;
        }

        .detail {
            background: #0d1326;
            border: 1px solid rgba(255, 255, 255, .09);
            border-radius: 8px;
            padding: 22px;
        }

        .detail small {
            display: block;
            color: #737c94;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .detail h3 {
            font-size: 16px;
            font-weight: 500;
        }

        /* Work Section */
        .work-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .work-title {
            font-size: 28px;
            font-weight: 600;
        }

        .work-line {
            height: 1px;
            background: rgba(255, 255, 255, .09);
            flex: 1;
            margin-left: 25px;
        }

        /* Screenshot */
        .screenshots {
            width: 100%;
        }

        .screenshot-card {
            background: #0d1326;
            border: 1px solid rgba(255, 255, 255, .09);
            border-radius: 10px;
            padding: 10px;
        }

        .screenshots img {
            width: 100%;
            display: block;
            border-radius: 6px;
        }

        /* Bottom Button */
        .bottom {
            text-align: center;
            padding: 55px 0;
        }

        .back-bottom {
            display: inline-block;
            padding: 11px 20px;
            background: #7c4dff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: opacity .2s;
        }

        .back-bottom:hover {
            opacity: .85;
        }

        /* Mobile */
        @media (max-width: 700px) {

            .container {
                width: min(100% - 30px, 1050px);
            }

            .header {
                padding: 55px 0 35px;
            }

            h1 {
                letter-spacing: -1px;
            }

            .details {
                grid-template-columns: 1fr;
                gap: 10px;
                margin-bottom: 55px;
            }

            .detail {
                padding: 18px;
            }

            .work-header {
                display: block;
            }

            .work-title {
                font-size: 25px;
            }

            .work-line {
                display: none;
            }

            .bottom {
                padding: 40px 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Back -->
    <a href="index.html" class="back">
        ← Back to Portfolio
    </a>

    <!-- Header -->
    <section class="header">

        <div class="category">
            E-COMMERCE
        </div>

        <h1>
            Shopify Product Research
        </h1>

        <p class="intro">
            A product research project focused on finding potential products,
            analyzing pricing, and organizing product information for an
            e-commerce store.
        </p>

    </section>

    

    <!-- Work -->
    <section>

        <div class="work-header">
            <h2 class="work-title">
                My Work
            </h2>

            <div class="work-line"></div>
        </div>

        <div class="screenshots">

            <div class="screenshot-card">
                <img src="prod-res1.jpg"
                     alt="Shopify product research screenshot">
            </div>

        </div>

    </section>

    <!-- Bottom -->
    <div class="bottom">

        <a href="index.html" class="back-bottom">
            ← Back to Projects
        </a>

    </div>

</div>

</body>
</html>
